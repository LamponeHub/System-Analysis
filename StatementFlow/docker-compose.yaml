version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:///./statements.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  bot:
    build: .
    command: python bot.py
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=sqlite:///./statements.db
    volumes:
      - ./data:/app/data
    depends_on:
      - web
    restart: unless-stopped