<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - StatementFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">👮 StatementFlow</h1>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700">Логин</label>
                <input type="text" id="username" required class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block text-gray-700">Пароль</label>
                <input type="password" id="password" required class="w-full border p-2 rounded">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
                Войти
            </button>
        </form>
        
        <hr class="my-6">
        
        <form id="registerForm" class="space-y-4">
            <h2 class="text-lg font-semibold">Регистрация</h2>
            <input type="text" id="reg_username" placeholder="Логин" required class="w-full border p-2 rounded">
            <input type="password" id="reg_password" placeholder="Пароль" required class="w-full border p-2 rounded">
            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded hover:bg-green-700">
                Зарегистрироваться
            </button>
        </form>
        
        <p id="message" class="mt-4 text-center text-sm"></p>
    </div>

    <script>
        let token = localStorage.getItem('access_token');
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            
            const response = await fetch('/token', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/dashboard';
            } else {
                document.getElementById('message').textContent = '❌ ' + data.detail;
                document.getElementById('message').className = 'mt-4 text-center text-sm text-red-500';
            }
        });
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('reg_username').value,
                    password: document.getElementById('reg_password').value
                })
            });
            
            const data = await response.json();
            if (response.ok) {
                document.getElementById('message').textContent = '✅ Регистрация успешна! Теперь войдите.';
                document.getElementById('message').className = 'mt-4 text-center text-sm text-green-500';
            } else {
                document.getElementById('message').textContent = '❌ ' + data.detail;
                document.getElementById('message').className = 'mt-4 text-center text-sm text-red-500';
            }
        });
    </script>
</body>
</html>
