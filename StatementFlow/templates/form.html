{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6">Конструктор заявления</h2>
    <form action="/create" method="POST">
        <div class="mb-4">
            <label class="block text-gray-700">Куда подаем?</label>
            <select name="target_department" class="w-full border p-2 rounded">
                <option>В Полицию (ОВД)</option>
                <option>В Прокуратуру</option>
                <option>В Суд</option>
            </select>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700">ФИО Заявителя</label>
                <input type="text" name="applicant_name" required class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block text-gray-700">Адрес проживания</label>
                <input type="text" name="applicant_address" required class="w-full border p-2 rounded">
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700">Заголовок (суть)</label>
            <input type="text" name="title" placeholder="Например: О краже имущества" required class="w-full border p-2 rounded">
        </div>

        <div class="mb-6">
            <label class="block text-gray-700">Описание обстоятельств</label>
            <textarea name="description" rows="6" required class="w-full border p-2 rounded"></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">Сохранить и Сгенерировать</button>
    </form>
</div>
{% endblock %}
